name: Build SHADOWit APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Fresh, minimal permission: the built-in token may only read the code and publish the release.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SHADOWit.apk
          ls -la dist

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ShadowIt-apk
          path: dist/SHADOWit.apk

      - name: Publish APK to the "latest" release
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/SHADOWit.apk \
            --title "SHADOWit (latest build)" \
            --notes "Latest signed APK. Download SHADOWit.apk and install it on your phone." \
            --latest
